# StorageClass using the EBS CSI driver (installed as an EKS addon in session-03-eks).
# gp3 is the current-generation EBS volume type — better performance and lower cost than gp2.
# WaitForFirstConsumer defers volume creation until a pod is scheduled, ensuring the
# EBS volume is created in the same AZ as the node (avoids cross-AZ mount failures).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-ssd
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  storageClassName: ebs-ssd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 7Gi
