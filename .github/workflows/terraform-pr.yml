name: Terraform PR Validation

# Runs on every PR targeting main.
# Validates code quality and posts a plan preview for BOTH environments as a PR comment.
# Nothing is applied — this workflow is read-only.
#
# GitHub Environments required:
#   dev       — existing environment with AWS credentials
#   prod-plan — environment WITHOUT required reviewers, same prod AWS credentials
#               (keeps the reviewer gate on apply only, not on PR planning)

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  pull-requests: write # required to post / update PR comments

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "ap-southeast-1"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Validate — format check + terraform validate
  # Runs in parallel with plan jobs (no dependency between them)
  # ──────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend — only needed for validate)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # ──────────────────────────────────────────────────────────────
  # Job 2: Plan Dev — show what would change in dev if merged
  # Runs in parallel with validate and plan-prod
  # ──────────────────────────────────────────────────────────────
  plan-dev:
    name: Plan / Dev
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/dev/dev.tfbackend

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file=environments/dev/dev.tfvars \
            -no-color \
            -detailed-exitcode 2>&1 | tee $GITHUB_WORKSPACE/dev_plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        with:
          name: dev-plan-output-${{ github.run_id }}
          path: dev_plan_output.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 3: Plan Prod — show what would change in prod if merged
  # Runs in parallel with validate and plan-dev
  #
  # Requires a `prod-plan` GitHub Environment with prod AWS
  # credentials but NO required reviewers (reviewer gate sits on
  # the apply step in terraform-release.yml, not here).
  # ──────────────────────────────────────────────────────────────
  plan-prod:
    name: Plan / Prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/prod/prod.tfbackend -reconfigure

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file=environments/prod/prod.tfvars \
            -no-color \
            -detailed-exitcode 2>&1 | tee $GITHUB_WORKSPACE/prod_plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        with:
          name: prod-plan-output-${{ github.run_id }}
          path: prod_plan_output.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 4: PR Comment — post combined validate + dev + prod result
  # Waits for all jobs above; runs even if they fail
  # ──────────────────────────────────────────────────────────────
  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [validate, plan-dev, plan-prod]
    if: always()
    steps:
      - name: Download dev plan output
        uses: actions/download-artifact@v4
        with:
          name: dev-plan-output-${{ github.run_id }}
          path: plan-artifacts/dev
        continue-on-error: true

      - name: Download prod plan output
        uses: actions/download-artifact@v4
        with:
          name: prod-plan-output-${{ github.run_id }}
          path: plan-artifacts/prod
        continue-on-error: true

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const validateResult = '${{ needs.validate.result }}';
            const planDevResult  = '${{ needs.plan-dev.result }}';
            const planProdResult = '${{ needs.plan-prod.result }}';

            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';

            const readPlan = path => {
              try {
                const txt = fs.readFileSync(path, 'utf8');
                return txt.length > 30000
                  ? txt.substring(0, 30000) + '\n\n_...output truncated_'
                  : txt;
              } catch (_) {
                return '_Plan output not available._';
              }
            };

            const devPlanOutput  = readPlan('plan-artifacts/dev/dev_plan_output.txt');
            const prodPlanOutput = readPlan('plan-artifacts/prod/prod_plan_output.txt');

            const sha7 = context.sha.slice(0, 7);

            const body = [
              '## Terraform Plan Preview',
              '',
              '| Check        | Result |',
              '|---|---|',
              `| Validate     | ${icon(validateResult)} \`${validateResult}\` |`,
              `| Plan — dev   | ${icon(planDevResult)} \`${planDevResult}\` |`,
              `| Plan — prod  | ${icon(planProdResult)} \`${planProdResult}\` |`,
              '',
              '<details><summary>Dev Plan Output (click to expand)</summary>',
              '',
              '```hcl',
              devPlanOutput,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Prod Plan Output (click to expand)</summary>',
              '',
              '```hcl',
              prodPlanOutput,
              '```',
              '',
              '</details>',
              '',
              `> Merging this PR will auto-deploy to **dev**. To promote to **prod**, tag the commit: \`git tag v<x>.<y>.<z> && git push --tags\``,
              '',
              `_Triggered by @${{ github.actor }} on commit \`${sha7}\`_`,
            ].join('\n');

            // Update existing bot comment rather than spamming new ones
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## Terraform Plan Preview')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
