name: Terraform PR Validation

# Runs on every PR targeting main.
# Validates both modules and posts a plan preview for both modules × both environments.
# Nothing is applied — this workflow is read-only.
#
# GitHub Environments required:
#   dev       — existing environment with AWS credentials
#   prod-plan — environment WITHOUT required reviewers, same prod AWS credentials

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/session-01-ec2/**"
      - "terraform/session-02-ecs/**"
      - "terraform/session-03-eks/**"
      - "terraform/session-04-argocd/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "ap-southeast-1"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Validate — fmt check + terraform validate per module
  # ──────────────────────────────────────────────────────────────
  validate:
    name: Validate / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [session-01-ec2, session-02-ecs, session-03-eks, session-04-argocd]
      fail-fast: false
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # ──────────────────────────────────────────────────────────────
  # Job 2: Plan Dev — show what would change in dev per module
  # ──────────────────────────────────────────────────────────────
  plan-dev:
    name: Plan / Dev / ${{ matrix.module }}
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      matrix:
        module: [session-01-ec2, session-02-ecs, session-03-eks, session-04-argocd]
      fail-fast: false
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/dev/dev.tfbackend

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file=environments/dev/dev.tfvars \
            -no-color \
            -detailed-exitcode \
            2>&1 | tee $GITHUB_WORKSPACE/plan_dev_${{ matrix.module }}.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        # session-04-argocd plan fails in PRs if the EKS cluster doesn't exist yet;
        # that's expected — the plan runs cleanly after session-03-eks is deployed.
        continue-on-error: true

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        with:
          name: plan-dev-${{ matrix.module }}-${{ github.run_id }}
          path: plan_dev_${{ matrix.module }}.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 3: Plan Prod — show what would change in prod per module
  # Uses prod-plan environment (no required reviewers)
  # ──────────────────────────────────────────────────────────────
  plan-prod:
    name: Plan / Prod / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [session-01-ec2, session-02-ecs, session-03-eks, session-04-argocd]
      fail-fast: false
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/prod/prod.tfbackend -reconfigure

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file=environments/prod/prod.tfvars \
            -no-color \
            -detailed-exitcode \
            2>&1 | tee $GITHUB_WORKSPACE/plan_prod_${{ matrix.module }}.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        with:
          name: plan-prod-${{ matrix.module }}-${{ github.run_id }}
          path: plan_prod_${{ matrix.module }}.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 4: PR Comment — post combined results for all modules
  # ──────────────────────────────────────────────────────────────
  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [validate, plan-dev, plan-prod]
    if: always()
    steps:
      - name: Download all plan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plan-*-${{ github.run_id }}
          path: plan-artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const validateResult = '${{ needs.validate.result }}';
            const planDevResult  = '${{ needs.plan-dev.result }}';
            const planProdResult = '${{ needs.plan-prod.result }}';

            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';

            const readPlan = name => {
              try {
                const txt = fs.readFileSync(`plan-artifacts/${name}`, 'utf8');
                return txt.length > 20000
                  ? txt.substring(0, 20000) + '\n\n_...output truncated_'
                  : txt;
              } catch (_) {
                return '_Plan output not available._';
              }
            };

            const modules = ['session-01-ec2', 'session-02-ecs'];
            const sha7 = context.sha.slice(0, 7);

            const planSections = modules.map(m => [
              `### Module: \`${m}\``,
              '',
              '<details><summary>Dev Plan (click to expand)</summary>',
              '',
              '```',
              readPlan(`plan_dev_${m}.txt`),
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Prod Plan (click to expand)</summary>',
              '',
              '```',
              readPlan(`plan_prod_${m}.txt`),
              '```',
              '',
              '</details>',
            ].join('\n')).join('\n\n---\n\n');

            const body = [
              '## Terraform Plan Preview',
              '',
              '| Check | Result |',
              '|---|---|',
              `| Validate (all modules) | ${icon(validateResult)} \`${validateResult}\` |`,
              `| Plan — dev             | ${icon(planDevResult)} \`${planDevResult}\` |`,
              `| Plan — prod            | ${icon(planProdResult)} \`${planProdResult}\` |`,
              '',
              planSections,
              '',
              `> Merging this PR will auto-deploy to **dev**. To promote to **prod**, tag the commit: \`git tag v<x>.<y>.<z> && git push --tags\``,
              '',
              `_Triggered by @${{ github.actor }} on commit \`${sha7}\`_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## Terraform Plan Preview')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
