name: Terraform PR Validation

# Runs on every PR targeting main.
# Validates code quality and posts a plan preview as a PR comment.
# Nothing is applied — this workflow is read-only.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  pull-requests: write # required to post / update PR comments

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "ap-southeast-1"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Validate — format check + terraform validate
  # Runs in parallel with plan-dev (no dependency between them)
  # ──────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend — only needed for validate)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # ──────────────────────────────────────────────────────────────
  # Job 2: Plan Dev — show what would change in dev if merged
  # Runs in parallel with validate
  # ──────────────────────────────────────────────────────────────
  plan-dev:
    name: Plan / Dev
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/dev/dev.tfbackend

      - name: Plan
        id: plan
        # Write output to workspace root so the artifact path is simple
        run: |
          terraform plan \
            -var-file=environments/dev/dev.tfvars \
            -no-color \
            -detailed-exitcode 2>&1 | tee $GITHUB_WORKSPACE/plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true # let pr-comment job run even if plan fails

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        with:
          name: dev-plan-output-${{ github.run_id }}
          path: plan_output.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 3: PR Comment — post combined validate + plan result
  # Waits for both jobs above; runs even if they fail
  # ──────────────────────────────────────────────────────────────
  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [validate, plan-dev]
    if: always()
    steps:
      - name: Download plan output
        uses: actions/download-artifact@v4
        with:
          name: dev-plan-output-${{ github.run_id }}
          path: plan-artifacts
        continue-on-error: true

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const validateResult = '${{ needs.validate.result }}';
            const planResult     = '${{ needs.plan-dev.result }}';

            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';

            let planOutput = '';
            try {
              planOutput = fs.readFileSync('plan-artifacts/plan_output.txt', 'utf8');
            } catch (_) {
              planOutput = '_Plan output not available._';
            }

            if (planOutput.length > 60000) {
              planOutput = planOutput.substring(0, 60000) + '\n\n_...output truncated_';
            }

            const sha7 = context.sha.slice(0, 7);

            const body = [
              '## Terraform Plan — Dev',
              '',
              '| Check | Result |',
              '|---|---|',
              `| Validate | ${icon(validateResult)} \`${validateResult}\` |`,
              `| Plan     | ${icon(planResult)} \`${planResult}\` |`,
              '',
              '<details><summary>Plan Output (click to expand)</summary>',
              '',
              '```hcl',
              planOutput,
              '```',
              '',
              '</details>',
              '',
              `_Triggered by @${{ github.actor }} on commit \`${sha7}\`_`,
            ].join('\n');

            // Update existing bot comment rather than spamming new ones
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## Terraform Plan — Dev')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
