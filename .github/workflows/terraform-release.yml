name: Terraform Release (Prod)

# Triggered by a git tag matching v<major>.<minor>.<patch>.
# This is the primary path for production deployment.
# Can also be triggered manually to deploy a specific module.
#
# Flow:
#   git tag v1.2.3 && git push --tags
#     → plan-prod  (automatic, saves binary plan artifact)
#     → apply-prod (waits for manual approval via `prod` GitHub Environment)
#
# GitHub Environments required:
#   prod — required reviewers set; holds prod AWS credentials

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to deploy to prod'
        required: true
        type: choice
        options:
          - all
          - session-01-ec2
          - session-02-ecs
        default: all
      release_version:
        description: 'Release version tag (e.g. v1.2.3)'
        required: true
        type: string

concurrency:
  group: terraform-release
  cancel-in-progress: false

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'ap-southeast-1'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Detect which modules to release and the version tag
  # ──────────────────────────────────────────────────────────────
  detect:
    name: Detect Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set.outputs.modules }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.release_version }}"
            if [ "${{ inputs.module }}" != "all" ]; then
              echo 'modules=["${{ inputs.module }}"]' >> $GITHUB_OUTPUT
            else
              echo 'modules=["session-01-ec2","session-02-ecs"]' >> $GITHUB_OUTPUT
            fi
          else
            VERSION="${{ github.ref_name }}"
            echo 'modules=["session-01-ec2","session-02-ecs"]' >> $GITHUB_OUTPUT
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────
  # Stage 1: Plan Prod — automatic, no human gate
  # ──────────────────────────────────────────────────────────────
  plan-prod:
    name: Plan / Prod / ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: detect
    environment: prod
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect.outputs.modules) }}
      fail-fast: false
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/prod/prod.tfbackend -reconfigure

      - name: Plan
        run: |
          terraform plan \
            -var-file=environments/prod/prod.tfvars \
            -var "release_version=${{ needs.detect.outputs.version }}" \
            -out=${{ matrix.module }}-prod.tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.module }}-prod-${{ needs.detect.outputs.version }}
          path: terraform/${{ matrix.module }}/${{ matrix.module }}-prod.tfplan
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Apply Prod — pauses for required reviewer approval
  # Reviewer should inspect the plan artifact before approving.
  # ──────────────────────────────────────────────────────────────
  apply-prod:
    name: Apply / Prod / ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: [detect, plan-prod]
    environment: prod
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect.outputs.modules) }}
      fail-fast: false
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/prod/prod.tfbackend -reconfigure

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.module }}-prod-${{ needs.detect.outputs.version }}
          path: terraform/${{ matrix.module }}

      - name: Apply
        run: terraform apply -auto-approve ${{ matrix.module }}-prod.tfplan
