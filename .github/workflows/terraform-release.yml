name: Terraform Release (Prod)

# Triggered by a signed git tag matching v<major>.<minor>.<patch>.
# This is the only way to deploy to production — never triggered by a branch push.
#
# Flow:
#   git tag v1.2.3 && git push --tags
#     → plan-prod  (automatic, saves binary plan artifact)
#     → apply-prod (waits for manual approval via `prod` GitHub Environment)
#
# GitHub Environments required:
#   prod-plan — no required reviewers; holds prod AWS credentials for planning
#   prod      — required reviewers set; holds prod AWS credentials for applying

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Only one release can run at a time
concurrency:
  group: terraform-release
  cancel-in-progress: false

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'ap-southeast-1'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stage 1: Plan Prod — generate and save the binary plan file
  # Automatic — no human gate here; the reviewer approves the apply
  # ──────────────────────────────────────────────────────────────
  plan-prod:
    name: Plan / Prod
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/prod/prod.tfbackend -reconfigure

      - name: Plan
        run: |
          terraform plan \
            -var-file=environments/prod/prod.tfvars \
            -var "release_version=${{ github.ref_name }}" \
            -out=prod.tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan-${{ github.ref_name }}
          # Path is relative to workspace root; preserves terraform/ prefix on download
          path: terraform/prod.tfplan
          # Keep 7 days so reviewers can inspect before approving
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Apply Prod — apply exactly the saved plan
  # Pauses here until a required reviewer approves in the GitHub UI.
  # The reviewer should download and inspect the plan artifact above
  # before approving.
  # ──────────────────────────────────────────────────────────────
  apply-prod:
    name: Apply / Prod
    runs-on: ubuntu-latest
    needs: plan-prod
    environment: prod   # Required Reviewers gate — set in GitHub Settings → Environments
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/prod/prod.tfbackend -reconfigure

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-tfplan-${{ github.ref_name }}
          # Extract to workspace root so the file lands at terraform/prod.tfplan
          path: terraform
          
      - name: Apply
        run: terraform apply -auto-approve prod.tfplan
