name: Terraform Deploy

# Deploys to DEV on push to main (for changes under pratice_duongdt/terraform or terraform),
# or to any environment/module via workflow_dispatch.

on:
  push:
    branches:
      - main
    paths:
      - "pratice_duongdt/terraform/**"
      - "terraform/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to deploy'
        required: true
        type: choice
        options:
          - ec2-lesson
          - ecs-lesson
          - session-01-ec2
          - session-02-ecs
          - session-03-eks
          - session-04-argocd
          - all
        default: ec2-lesson

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "ap-southeast-1"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Detect which modules need to be deployed
  # ──────────────────────────────────────────────────────────────
  detect:
    name: Detect Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set.outputs.modules }}
      has_modules: ${{ steps.set.outputs.has_modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set target modules
        id: set
        run: |
          set -e
          MODULES_JSON="[]"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED="${{ inputs.module }}"
            case "$SELECTED" in
              ec2-lesson)
                MODULES_JSON='[{"name":"ec2-lesson","dir":"pratice_duongdt/terraform/ec2-lesson"}]'
                ;;
              ecs-lesson)
                MODULES_JSON='[{"name":"ecs-lesson","dir":"pratice_duongdt/terraform/ecs-lesson"}]'
                ;;
              session-01-ec2)
                MODULES_JSON='[{"name":"session-01-ec2","dir":"terraform/session-01-ec2"}]'
                ;;
              session-02-ecs)
                MODULES_JSON='[{"name":"session-02-ecs","dir":"terraform/session-02-ecs"}]'
                ;;
              session-03-eks)
                MODULES_JSON='[{"name":"session-03-eks","dir":"terraform/session-03-eks"}]'
                ;;
              session-04-argocd)
                MODULES_JSON='[{"name":"session-04-argocd","dir":"terraform/session-04-argocd"}]'
                ;;
              all)
                LIST=()
                for d in pratice_duongdt/terraform/* terraform/*; do
                  if [ -d "$d" ] && (ls $d/*.tf >/dev/null 2>&1) && ([ -f "$d/environments/dev/dev.tfbackend" ] || [ -f "$d/environment/dev/dev.tfbackend" ]); then
                    MNAME=$(basename "$d")
                    LIST+=("{\"name\":\"$MNAME\",\"dir\":\"$d\"}")
                  fi
                done
                MODULES_JSON="[$(IFS=,; echo "${LIST[*]}")]"
                ;;
            esac
          else
            # Push to main: detect changed directories
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD || true)
            else
              CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || git diff-tree --no-commit-id --name-only -r HEAD || true)
            fi
            echo "Changed files:"
            echo "$CHANGED"

            LIST=()
            for d in pratice_duongdt/terraform/* terraform/*; do
              if [ -d "$d" ] && (ls $d/*.tf >/dev/null 2>&1); then
                if echo "$CHANGED" | grep -q "^$d/"; then
                  MNAME=$(basename "$d")
                  LIST+=("{\"name\":\"$MNAME\",\"dir\":\"$d\"}")
                fi
              fi
            done

            # Fallback if pratice_duongdt/terraform was modified or workflow changed
            if [ ${#LIST[@]} -eq 0 ]; then
              if echo "$CHANGED" | grep -q "pratice_duongdt/terraform"; then
                LIST+=("{\"name\":\"ec2-lesson\",\"dir\":\"pratice_duongdt/terraform/ec2-lesson\"}")
              fi
            fi

            MODULES_JSON="[$(IFS=,; echo "${LIST[*]}")]"
          fi

          echo "Detected modules: $MODULES_JSON"
          COUNT=$(echo "$MODULES_JSON" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "has_modules=true" >> $GITHUB_OUTPUT
            echo "modules=$MODULES_JSON" >> $GITHUB_OUTPUT
          else
            echo "has_modules=false" >> $GITHUB_OUTPUT
            echo "modules=[]" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────────────────────
  # Plan Phase
  # ──────────────────────────────────────────────────────────────
  plan:
    name: Plan / Dev / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_modules == 'true'
    environment: dev
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.modules) }}
      fail-fast: false
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: |
          BACKEND_FILE="environments/dev/dev.tfbackend"
          if [ ! -f "$BACKEND_FILE" ] && [ -f "environment/dev/dev.tfbackend" ]; then
            BACKEND_FILE="environment/dev/dev.tfbackend"
          fi
          terraform init -backend-config="$BACKEND_FILE"
      - name: Plan
        run: |
          TFVARS_FILE="environments/dev/dev.tfvars"
          if [ ! -f "$TFVARS_FILE" ] && [ -f "environment/dev/dev.tfvars" ]; then
            TFVARS_FILE="environment/dev/dev.tfvars"
          fi
          VAR_OPT=""
          if [ -f "$TFVARS_FILE" ]; then
            VAR_OPT="-var-file=$TFVARS_FILE"
          fi
          terraform plan \
            $VAR_OPT \
            -var "release_version=dev-${GITHUB_SHA:0:7}" \
            -out=${{ matrix.name }}-dev.tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.name }}-dev-${{ github.sha }}
          path: ${{ matrix.dir }}/${{ matrix.name }}-dev.tfplan
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Apply Phase
  # ──────────────────────────────────────────────────────────────
  apply:
    name: Apply / Dev / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [detect, plan]
    if: needs.detect.outputs.has_modules == 'true' && needs.plan.result == 'success'
    environment: dev
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.modules) }}
      fail-fast: false
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: |
          BACKEND_FILE="environments/dev/dev.tfbackend"
          if [ ! -f "$BACKEND_FILE" ] && [ -f "environment/dev/dev.tfbackend" ]; then
            BACKEND_FILE="environment/dev/dev.tfbackend"
          fi
          terraform init -backend-config="$BACKEND_FILE"
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.name }}-dev-${{ github.sha }}
          path: ${{ matrix.dir }}
      - name: Apply
        run: terraform apply -auto-approve ${{ matrix.name }}-dev.tfplan
