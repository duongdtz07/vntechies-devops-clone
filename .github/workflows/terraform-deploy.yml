name: Terraform Deploy (Dev)

# Runs when code is merged into main.
# Deploys to DEV only — prod is promoted via a signed git tag (terraform-release.yml).
# Plan is saved as an artifact and reused by the apply job so what you reviewed is
# exactly what gets applied.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

# Prevent concurrent deployments — let the running pipeline finish before starting another
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "ap-southeast-1"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stage 1: Plan DEV — generate and save the binary plan file
  # ──────────────────────────────────────────────────────────────
  plan-dev:
    name: Plan / Dev
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/dev/dev.tfbackend

      - name: Plan
        run: |
          terraform plan \
            -var-file=environments/dev/dev.tfvars \
            -var "release_version=dev-${GITHUB_SHA:0:7}" \
            -out=dev.tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-tfplan-${{ github.sha }}
          # Path is relative to workspace root; preserves the terraform/ prefix on download
          path: terraform/dev.tfplan
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Apply DEV — apply exactly the saved plan, nothing else
  # ──────────────────────────────────────────────────────────────
  apply-dev:
    name: Apply / Dev
    runs-on: ubuntu-latest
    needs: plan-dev
    environment: dev
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/dev/dev.tfbackend

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-tfplan-${{ github.sha }}
          # upload-artifact v4 strips the leading directory, so the artifact
          # contains dev.tfplan (not terraform/dev.tfplan). Download directly
          # into terraform/ so the apply step finds it as dev.tfplan.
          path: terraform

      - name: Apply
        run: terraform apply -auto-approve dev.tfplan

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Integration Tests — runs after DEV apply succeeds
  # Replace placeholder steps with your actual test commands
  # ──────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: apply-dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check EC2 instances are running in dev
        run: |
          echo "Checking DEV EC2 instances..."
          aws ec2 describe-instances \
            --filters "Name=tag:env,Values=dev" "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text
          echo "EC2 check passed."

      # TODO: add more integration tests here
      # e.g. pytest tests/integration/ --env dev
      # e.g. curl health-check endpoint
