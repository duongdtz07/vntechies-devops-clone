name: Terraform Deploy

# Deploys to DEV on push to main, or to any environment via workflow_dispatch.
# Prod deployments via git tag → use terraform-release.yml instead.
#
# Deploy order:
#   Phase 1 (parallel): session-01-ec2 | session-02-ecs | session-03-eks
#   Phase 2 (after phase 1): session-04-argocd
#
# session-04-argocd requires session-03-eks to already be deployed
# because its Helm/Kubernetes providers need the EKS cluster to exist.

on:
  push:
    branches: [main]
    paths:
      - "terraform/session-01-ec2/**"
      - "terraform/session-02-ecs/**"
      - "terraform/session-03-eks/**"
      - "terraform/session-04-argocd/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to deploy'
        required: true
        type: choice
        options:
          - all
          - session-01-ec2
          - session-02-ecs
          - session-03-eks
          - session-04-argocd
        default: all

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "ap-southeast-1"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Detect which modules belong to each phase
  # ──────────────────────────────────────────────────────────────
  detect:
    name: Detect Modules
    runs-on: ubuntu-latest
    outputs:
      infra_modules:  ${{ steps.set.outputs.infra_modules }}
      has_infra:      ${{ steps.set.outputs.has_infra }}
      deploy_argocd:  ${{ steps.set.outputs.deploy_argocd }}
    steps:
      - name: Set phase lists
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODULE="${{ inputs.module }}"
          else
            MODULE="all"
          fi

          case "$MODULE" in
            session-01-ec2)
              echo 'infra_modules=["session-01-ec2"]' >> $GITHUB_OUTPUT
              echo 'has_infra=true'                   >> $GITHUB_OUTPUT
              echo 'deploy_argocd=false'              >> $GITHUB_OUTPUT ;;
            session-02-ecs)
              echo 'infra_modules=["session-02-ecs"]' >> $GITHUB_OUTPUT
              echo 'has_infra=true'                   >> $GITHUB_OUTPUT
              echo 'deploy_argocd=false'              >> $GITHUB_OUTPUT ;;
            session-03-eks)
              echo 'infra_modules=["session-03-eks"]' >> $GITHUB_OUTPUT
              echo 'has_infra=true'                   >> $GITHUB_OUTPUT
              echo 'deploy_argocd=false'              >> $GITHUB_OUTPUT ;;
            session-04-argocd)
              echo 'infra_modules=["__none__"]'       >> $GITHUB_OUTPUT
              echo 'has_infra=false'                  >> $GITHUB_OUTPUT
              echo 'deploy_argocd=true'               >> $GITHUB_OUTPUT ;;
            *)  # all | push event
              echo 'infra_modules=["session-01-ec2","session-02-ecs","session-03-eks"]' >> $GITHUB_OUTPUT
              echo 'has_infra=true'                   >> $GITHUB_OUTPUT
              echo 'deploy_argocd=true'               >> $GITHUB_OUTPUT ;;
          esac

  # ──────────────────────────────────────────────────────────────
  # Phase 1 — Plan: 01 + 02 + 03 in parallel
  # ──────────────────────────────────────────────────────────────
  plan-infra:
    name: Plan / Dev / ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_infra == 'true'
    environment: dev
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect.outputs.infra_modules) }}
      fail-fast: false
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: terraform init -backend-config=environments/dev/dev.tfbackend
      - name: Plan
        run: |
          terraform plan \
            -var-file=environments/dev/dev.tfvars \
            -var "release_version=dev-${GITHUB_SHA:0:7}" \
            -out=${{ matrix.module }}-dev.tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.module }}-dev-${{ github.sha }}
          path: terraform/${{ matrix.module }}/${{ matrix.module }}-dev.tfplan
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Phase 1 — Apply: 01 + 02 + 03 in parallel (after their plans)
  # ──────────────────────────────────────────────────────────────
  apply-infra:
    name: Apply / Dev / ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: [detect, plan-infra]
    if: needs.detect.outputs.has_infra == 'true' && needs.plan-infra.result == 'success'
    environment: dev
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect.outputs.infra_modules) }}
      fail-fast: false
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: terraform init -backend-config=environments/dev/dev.tfbackend
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.module }}-dev-${{ github.sha }}
          path: terraform/${{ matrix.module }}
      - name: Apply
        run: terraform apply -auto-approve ${{ matrix.module }}-dev.tfplan

  # ──────────────────────────────────────────────────────────────
  # Phase 2 — Plan ArgoCD (after infra is applied or skipped)
  # EKS cluster now exists → Helm/K8s providers initialize cleanly
  # ──────────────────────────────────────────────────────────────
  plan-argocd:
    name: Plan / Dev / session-04-argocd
    runs-on: ubuntu-latest
    needs: [detect, apply-infra]
    if: |
      always() &&
      needs.detect.outputs.deploy_argocd == 'true' &&
      (needs.apply-infra.result == 'success' || needs.apply-infra.result == 'skipped')
    environment: dev
    defaults:
      run:
        working-directory: terraform/session-04-argocd
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: terraform init -backend-config=environments/dev/dev.tfbackend
      - name: Plan
        run: |
          terraform plan \
            -var-file=environments/dev/dev.tfvars \
            -var "release_version=dev-${GITHUB_SHA:0:7}" \
            -out=session-04-argocd-dev.tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-session-04-argocd-dev-${{ github.sha }}
          path: terraform/session-04-argocd/session-04-argocd-dev.tfplan
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Phase 2 — Apply ArgoCD
  # ──────────────────────────────────────────────────────────────
  apply-argocd:
    name: Apply / Dev / session-04-argocd
    runs-on: ubuntu-latest
    needs: plan-argocd
    environment: dev
    defaults:
      run:
        working-directory: terraform/session-04-argocd
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: terraform init -backend-config=environments/dev/dev.tfbackend
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-session-04-argocd-dev-${{ github.sha }}
          path: terraform/session-04-argocd
      - name: Apply
        run: terraform apply -auto-approve session-04-argocd-dev.tfplan

