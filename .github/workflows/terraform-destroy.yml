name: Terraform Destroy

# Triggered manually via GitHub Actions UI.
# Select the target environment (dev or prod) at run time.
# Production requires manual approval via GitHub Environment protection rules.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

concurrency:
  group: terraform-destroy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'ap-southeast-1'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Guard — abort immediately if the confirmation word is wrong
  # ──────────────────────────────────────────────────────────────
  guard:
    name: Confirm Destroy
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "❌ Confirmation failed. You must type 'destroy' to proceed."
            exit 1
          fi
          echo "✅ Confirmation accepted. Proceeding with destroy of '${{ inputs.environment }}'."

  # ──────────────────────────────────────────────────────────────
  # Destroy DEV (runs only when environment = dev)
  # ──────────────────────────────────────────────────────────────
  destroy-dev:
    name: Destroy / Dev
    runs-on: ubuntu-latest
    needs: guard
    if: inputs.environment == 'dev'
    environment: dev
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/dev/dev.tfbackend

      - name: Plan destroy
        run: terraform plan -destroy -var-file=environments/dev/dev.tfvars -no-color

      - name: Destroy
        run: terraform destroy -var-file=environments/dev/dev.tfvars -auto-approve

  # ──────────────────────────────────────────────────────────────
  # Destroy PROD (runs only when environment = prod)
  # Requires manual approval — set "Required reviewers" on the
  # `prod` environment in GitHub Settings → Environments
  # ──────────────────────────────────────────────────────────────
  destroy-prod:
    name: Destroy / Prod
    runs-on: ubuntu-latest
    needs: guard
    if: inputs.environment == 'prod'
    environment: prod
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=environments/prod/prod.tfbackend -reconfigure

      - name: Plan destroy
        run: terraform plan -destroy -var-file=environments/prod/prod.tfvars -no-color

      - name: Destroy
        run: terraform destroy -var-file=environments/prod/prod.tfvars -auto-approve
